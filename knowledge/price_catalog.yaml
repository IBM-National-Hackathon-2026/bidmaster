# Katalog Harga — Kilat Studio (DUMMY)
# SATU-SATUNYA sumber harga. Model dilarang membuat angka sendiri.

packages:
  - id: basic
    name: Basic
    price_idr: 5000000
    timeline_weeks: 2
    features:
      - Landing page 5 section
      - Company profile + galeri
      - Form kontak WhatsApp
      - SEO dasar + SSL
    best_for: "Usaha yang butuh tampil online cepat"

  - id: standard
    name: Standard
    price_idr: 10000000
    timeline_weeks: 4
