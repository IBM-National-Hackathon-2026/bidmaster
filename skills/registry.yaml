# Skill Registry — BidMaster (MCP Tools)
# Daftarkan tiap flow Langflow yang di-expose via MCP di sini.

- id: proposal
  mcp_tool_name: generate_proposal_draft
  trigger: "buatkan proposal / penawaran web"
  flow_file: langflow/flows/generate_proposal_draft.json
