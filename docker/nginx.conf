server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Kompresi (JS/CSS/SVG/JSON) ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # ---- Aset ber-hash dari Vite: cache selamanya (nama berubah tiap build) ----
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---- Aset statis stabil (font, gambar, ikon) ----
    location ~* \.(woff2?|png|jpe?g|webp|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # ---- API → Laravel ----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # agent Langflow bisa >60 dtk (RAG + LLM), samakan dengan timeout backend 300 dtk
        proxy_connect_timeout 330s;
        proxy_send_timeout 330s;
        proxy_read_timeout 330s;
    }

    # ---- SPA: index.html tidak di-cache agar build baru langsung terpakai ----
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
